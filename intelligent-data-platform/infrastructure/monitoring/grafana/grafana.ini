# ============================================================
# infrastructure/monitoring/grafana/grafana.ini — Grafana 服务端配置（Sprint 11）
# ============================================================
#
# 只写"必须显式决定"的项，其余保持 Grafana 默认值 ——
# 抄一份完整默认配置进仓库，会在升级时制造一堆"看起来是我们改的"差异。
#
# 内存纪律（本机 16 GB，实时链路常驻 ~13.7 GB，监控总预算 <= 512 MB）：
#   Grafana 是 Go 程序，默认没有硬上限；容器侧由 compose 的 mem_limit: 256m 兜住。
#   这里额外把"能显著吃内存"的项关掉：
#     - 不开 unified alerting 的高频求值（本项目不做告警，
#       阈值判断交给 infrastructure/quality/，那样才有可审计的 SQL）
#     - 不装任何外部插件（插件是 Grafana 内存增长的主要来源之一）
# ============================================================

[server]
# 只监听容器内的 3000；对外经 Nginx 的 /grafana/ 反代（不直接暴露到公网）
http_port = 3000
# 为什么开 root_url 的子路径：Nginx 把 /grafana/ 反代到这里，
# 页面里的静态资源与 API 路径都要带上这个前缀，否则会出现
# "登录页能打开、一登录就 404"（与 Sprint 4 Airflow 的坑同族）。
root_url = %(protocol)s://%(domain)s:%(http_port)s/grafana/
serve_from_sub_path = true
enable_gzip = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[metrics]
# 让 Prometheus 能抓 Grafana 自身（未开鉴权；只暴露计数器与耗时直方图）
enabled = true
interval_seconds = 30
# !! 必须显式写绝对路由，否则 serve_from_sub_path=true 会把 metrics 路由
#    也顶到 /grafana/metrics 下（实测：直连 127.0.0.1:3000/metrics 有 3320 条
#    grafana_* 指标，但 Prometheus 抓 http://grafana:3000/metrics 得到的是
#    "dial ... connect: connection refused" 前的 404，target 一直 down）。
#    写绝对路径 /metrics 后，两条路径都成立：
#      容器内 Prometheus  → http://grafana:3000/metrics
#      宿主 Nginx /metrics/（剥前缀后仍是 /metrics）
metrics_route_prefix = /metrics

[auth]
# 关掉匿名访问的**写**能力，同时允许只读浏览：
# 演示时评审老师不需要登录就能看面板，但改不了任何配置。
disable_login_form = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[users]
# 默认管理员账号的**口令由 .env 注入**（GF_SECURITY_ADMIN_PASSWORD），
# 这里不写任何口令，仓库里也就不会有口令。
allow_sign_up = false

[snapshots]
external_enabled = false

[unified_alerting]
enabled = false

[alerting]
enabled = false

[plugins]
# 不预装、不自动更新插件。
# 为什么显式写：Grafana 13.2 起 MySQL 数据源变成"随版本更新的独立插件"，
# 默认会在启动时联网检查插件目录 —— 本机到公网的出口不稳定
# （实测直连 Docker Hub / GitHub API 均超时），自动更新会拖慢启动甚至报错。
# MySQL 数据源本身**已随 OSS 镜像预装**，无需下载任何插件。
preinstall_auto_update = false
