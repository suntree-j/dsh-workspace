# ============================================================
# Spark 默认配置（Sprint 2：离线链路）
# ============================================================
#
# 挂载到 /opt/spark/conf/spark-defaults.conf，master / worker / 作业三者共用。
#
# 为什么不在这里写 S3A 凭据：
#   spark-defaults.conf **不做** ${env:...} 变量替换（那是 Hadoop XML 的能力），
#   写了也只会被当成字面量。因此凭据由 scripts/submit-offline-job.sh
#   从 .env 读出后通过 `--conf` 传入 —— 既确定生效，也让仓库里没有口令。
# ============================================================

# ---------- 目录与 Metastore ----------
# 用 Hive Metastore 作为 catalog：Spark SQL 建的表，别的引擎（后续的
# Airflow 里的 spark-sql、Trino 等）也能看到同一份元数据。
spark.sql.catalogImplementation        hive
spark.sql.warehouse.dir                s3a://lakehouse/warehouse
spark.hadoop.hive.metastore.uris       thrift://hive-metastore:9083

# ---------- Hive 客户端与服务端的版本匹配（实测踩坑，结论写在这里）----------
#   Spark 3.5 内置的 Hive 客户端是 **2.3.9**。
#   × 用 Hive 4.0.1 的 Metastore：Hive 4 移除了旧的 thrift 方法 get_table，
#     建表时报 `Unable to fetch table ... Invalid method name: 'get_table'`。
#   × 想让 Spark 换成 Hive 4 客户端（jars=path）：Spark 对
#     spark.sql.hive.metastore.version 有白名单（只认 3.1.3 及以下）。
#   × 声明 metastore.version=3.1.3 但用内置客户端会被直接拒绝：
#     Builtin jars can only be used when hive execution version == hive metastore version.
#     Execution: 2.3.9 != Metastore: 3.1.3
#   √ 最终选择：**Metastore 服务端用 Hive 3.1.3，Spark 用内置的 2.3.9 客户端**
#     （即不设置 metastore.version，保持默认）。
#     Hive 3.1.x 同时保留新旧 thrift 方法，2.3.9 客户端可以正常建表查表；
#     这是 Spark 3.x 生态里长期使用的组合，不需要任何额外 JAR，也不联网。
#   详见 docs/sprint/SPRINT_2.md 第 6 节的风险记录。
#
# 让 Hive 客户端与 Spark 共享这些包的类，避免出现
# Class org.apache.hadoop.fs.s3a.S3AFileSystem not found
spark.sql.hive.metastore.sharedPrefixes com.amazonaws,org.apache.hadoop,org.apache.hive.common.util,org.slf4j,javax.annotation,com.google.common

# ---------- Iceberg 表格式（Sprint 5）----------
#
# !! spark.sql.extensions 是**静态配置**，必须写在这里，不能用 SQL 的 SET !!
#   实测踩坑：我用 `spark-sql -e "SET spark.sql.extensions=...; SHOW DATABASES;"`
#   去验证类可见性，直接报：
#       Cannot modify the value of a static config: spark.sql.extensions
#   这类配置只在**会话创建时**读取一次，运行时改不了。
#   （这不是 Iceberg 的问题，是 Spark 对 static config 的通用限制。）
#
# 为什么需要 extensions：
#   它把 Iceberg 的 SQL 语法（如 ALTER TABLE ... ADD PARTITION FIELD、
#   时间旅行 `VERSION AS OF`）接进 Spark 的解析器。
#   不装也能读写 Iceberg 表，但用不了这些语法。
spark.sql.extensions                     org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Iceberg Catalog：复用已有的 Hive Metastore 3.1.3
#
# !! 为什么库名用 lakehouse_iceberg 而不是覆盖 lakehouse !!
#   Sprint 2/3/4 的四层表是 Hive 外部表（STORED AS PARQUET）。
#   `CREATE TABLE ... USING iceberg` 与 `CREATE EXTERNAL TABLE ... STORED AS PARQUET`
#   是两种表；同名替换会覆盖元数据且**无法回滚**。
#   用新库名 + 逐表对照行数与金额，才是"可验证、可回滚"的最小步做法
#   （见 docs/sprint/SPRINT_5.md 3.2 节）。
#
# 为什么用 HiveCatalog 而不是 REST/Hadoop Catalog：
#   ① 本机已经有 Hive Metastore 在跑，零新增常驻进程
#      （可用内存只够维持现有栈，这一点是决定性的）；
#   ② 两种表格式**共用同一个 Metastore**，迁移期能并存对照。
spark.sql.catalog.lakehouse_iceberg            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse_iceberg.type       hive
spark.sql.catalog.lakehouse_iceberg.uri        thrift://hive-metastore:9083
spark.sql.catalog.lakehouse_iceberg.warehouse  s3a://lakehouse/warehouse

# 写入格式与压缩：与现有 Parquet 表保持一致，便于对照体积与查询性能
spark.sql.catalog.lakehouse_iceberg.write.format.default            parquet
spark.sql.catalog.lakehouse_iceberg.write.parquet.compression-codec snappy
# 快照过期：本机磁盘余 55 GB，但快照会随每次写入累积。
# 保留 7 天足够演示与排错，也避免无限增长（Sprint 5 风险清单第 6 条）。
spark.sql.catalog.lakehouse_iceberg.history.expire.max-snapshot-age-ms 604800000

# ---------- S3A（MinIO）——非敏感项 ----------
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.attempts.maximum            3
# 让相对路径默认落在 S3A，避免误写容器本地磁盘
spark.hadoop.fs.defaultFS                       s3a://lakehouse

# ---------- 资源（服务器内存紧张，必须显式限制）----------
# 服务器实测可用内存见 SPRINT_2.md 第 2.3 节
spark.driver.memory                    1024m
spark.driver.maxResultSize             256m
spark.executor.memory                  1024m
spark.executor.cores                   1
# 全量抽取的数据量很小（5 张表合计约 1.4 万行），并行度 2 足够
spark.default.parallelism              2
spark.sql.shuffle.partitions           2

# ---------- 时间与序列化 ----------
spark.sql.session.timeZone             Asia/Shanghai
spark.serializer                       org.apache.spark.serializer.KryoSerializer

# ---------- 事件日志：留下 UI 可回看的历史，便于答辩演示 ----------
spark.eventLog.enabled                 true
spark.eventLog.dir                     s3a://lakehouse/spark-events

# ---------- 其它 ----------
spark.ui.showConsoleProgress           false
spark.sql.adaptive.enabled             true
