# ============================================================
# infrastructure/quality/checks.conf — 数据质量校验清单（Sprint 11）
# ============================================================
#
# 本文件是**校验清单**：一条校验 = 一段配置，不是一段代码。
# 执行引擎是 infrastructure/quality/run-check.sh（逐条解释本文件）。
#
# 为什么做成"配置 + 引擎"而不是写成一堆 if：
#   加一条校验只需要加一段配置、放一个返回**标量**的 SQL，
#   不需要动引擎代码 —— 也就不需要重新审一遍"会不会把别的校验改坏"。
#
# ------------------------------------------------------------
# 格式（每条校验一段，字段名固定）
# ------------------------------------------------------------
#
#   [check.<id>]
#   title      校验项名称（会打印出来）
#   domain     trade | traffic | layer | cross | source    （分组用）
#   severity   error | warn
#                error —— 判失败，必须让脚本 exit 1
#                warn  —— 只报告，不改变退出码（用于"环境相关、不该红"的项）
#   engine     doris | spark
#                doris —— 经 Doris FE 用 MySQL 协议查（实时链路 + 已装载的离线结果）
#                spark —— 经一次性 spark-sql 容器查湖仓（Iceberg/Parquet，
#                         需要约 1 GB 可用内存，默认**不跑**，见 run-quality-checks.sh --with-lake)
#   sql        SQL 文件路径（相对本目录），**必须返回恰好一个标量值**
#   op         判定算子：
#                gt  <阈值>   实测值 > 阈值          行数非空守卫
#                ge  <阈值>   实测值 >= 阈值
#                eq  <阈值>   实测值 == 阈值          对账/一致性
#                le  <阈值>   实测值 <= 阈值
#                lt  <阈值>   实测值 < 阈值
#             数值比较用 awk 做**字符串→数值**比较，避免 bash 对小数/空值的坑。
#   expect     可选。**有 expect 就用 expect 做字面比对**（此时 op 只作为兜底打印）。
#              参数化：{DATE} {DATETIME} {NOW} 由引擎替换成服务器当前时间；
#              {TODAY_STR} / {NOW_STR} 是待替换的占位（供 SQL 内部当字符串用）。
#              例：expect = 2026-09-26     → 校验"最新分区日期 == 某个确定日期"
#   fresh_field     freshness 专用：值 = "列名|期望语义"（仅作打印说明）
#   description 可选。这条校验在防什么（为什么它值得存在）
#   hint        可选。失败时给人的排查提示
#
# 设计约定（重要）：
#   1) SQL **必须单行**、以分号结尾、只返回一个值 —— 引擎取最后一行。
#   2) 任何"在空集合上会全绿"的判断，必须先用 gt / ge 做**非空守卫**，
#      否则表被清空时校验会静默通过（Sprint 4 踩过这个坑）。
#   3) 金额只做**等值**比较（DECIMAL 精确），不做浮点近似。
# ============================================================


# ============================================================
# 一、行数非空守卫
#
# 为什么放在最前面：后面所有"差异数 == 0""不一致窗口 == 0"之类的判断，
# 在**空表**上都会成立。没有守卫的话，一次误清空会让整份报告全绿。
# ============================================================

[check.rowcount_trade]
title      交易域非空守卫（实时 DWD 三表 + 离线 ADS）
domain     trade
severity   error
engine     doris
sql        checks/rowcount_trade.sql
op         eq
expect     1
description 订单/支付/退款明细与离线交易 ADS 都必须 > 0；任一为 0 → 返回 0
hint       若订单明细为 0：先看 Flink 作业与 Routine Load（bash scripts/health-check.sh）

[check.rowcount_traffic]
title      流量域非空守卫（行为明细 + 流量 ADS 三表）
domain     traffic
severity   error
engine     doris
sql        checks/rowcount_traffic.sql
op         eq
expect     1
description 流量域刚建好（Sprint 5 阶段），必须与交易域一样有非空守卫
hint       若 ads_traffic_1m 为 0：先确认离线装载（load-batch-to-doris.sh）与流量域分层是否跑过

[check.rowcount_layer]
title      分层表非空守卫（ODS/DWD/DWS/ADS 各层代表表）
domain     layer
severity   error
engine     doris
sql        checks/rowcount_layer.sql
op         eq
expect     1
description 一次性确认四大分层都还在提供数据


# ============================================================
# 二、主键唯一
#
# 为什么要单独查：Doris 用的是 UNIQUE KEY + merge-on-write，
# 理论上"不该有重复"。但**理论不等于事实** —— 一旦 BE 的 MOW 没生效，
# 或者有人建表时漏了 UNIQUE KEY，查询会在毫无征兆的情况下把金额算成两倍。
# 所以这里用 GROUP BY ... HAVING COUNT(*) > 1 显式验证。
# ============================================================

[check.pk_unique_trade]
title      交易域主键唯一（order_id / payment_id / refund_id）
domain     trade
severity   error
engine     doris
sql        checks/pk_unique_trade.sql
op         eq
expect     0
description 主键为 NULL 的行数 + "COUNT(*) - COUNT(DISTINCT 主键)" 之和必须为 0
hint       非 0 → 主键为空（UNIQUE KEY 不拦 NULL）或建表漏了 UNIQUE KEY

[check.pk_unique_traffic]
title      流量域主键唯一（event_id）
domain     traffic
severity   error
engine     doris
sql        checks/pk_unique_traffic.sql
op         eq
expect     0
description 行为明细 event_id 的 NULL 数 + 丢失行数必须为 0
hint       非 0 → 归档重放跨 dt 分区重复，见 infrastructure/spark/jobs/archive_behavior_events.py

[check.pk_unique_ads]
title      离线 ADS 窗口主键唯一（trade 1m / traffic 1m + 1d）
domain     layer
severity   error
engine     doris
sql        checks/pk_unique_ads.sql
op         eq
expect     0
description 窗口键为 NULL 或不唯一的行数必须为 0
hint       非 0 → 装载脚本重复插入且未走 UNIQUE KEY（load-batch-to-doris.sh）


# ============================================================
# 三、关键字段非空
#
# 为什么不用 information_schema 查 NULL 约束：
#   Doris 里"列可以为 NULL"是允许的（窗口聚合没有事件时比率就是 NULL）。
#   这里查的是**业务上不该为空**的列真的没空 —— 那才是数据质量。
#   例：event_time 为空的行不会报错，只会在窗口聚合时**静默消失**（少数据）。
# ============================================================

[check.notnull_trade]
title      交易域关键字段非空（主键 / user_id / amount / event_time）
domain     trade
severity   error
engine     doris
sql        checks/notnull_trade.sql
op         eq
expect     0
description 8 个"空一行就少一行钱"的统计量之和必须为 0

[check.notnull_traffic]
title      流量域关键字段非空（user_id / event_time / event_type / dt）
domain     traffic
severity   error
engine     doris
sql        checks/notnull_traffic.sql
op         eq
expect     0
description 窗口键与漏斗枚举为空会造成"静默少数据"，必须显式归零

[check.notnull_ads_win]
title      离线 ADS 窗口字段非空（window_start / window_end）
domain     layer
severity   error
engine     doris
sql        checks/notnull_ads_win.sql
op         eq
expect     0
description 窗口键为空的行在 Grafana/接口里会凭空消失


# ============================================================
# 四、枚举合法
#
# 行为漏斗的 event_type 是**口径的一部分**（sql/metadata/metrics.md 第 3 节）：
# 白名单是 VIEW/CLICK/CART/FAVORITE/BUY（+ 归档 ODS 里的 SEARCH）。
# 出现白名单之外的取值，通常意味着上游加了新事件类型却没有人更新口径 ——
# 那种情况下"漏斗少了一级"会被误读成"用户行为变了"。
# ============================================================

[check.enum_event_type]
title      行为枚举合法（VIEW/CLICK/CART/FAVORITE/BUY）
domain     traffic
severity   error
engine     doris
sql        checks/enum_event_type.sql
op         eq
expect     0
description 白名单外的 event_type 行数必须为 0

[check.enum_payment_status]
title      支付状态枚举合法（SUCCESS/FAILED）
domain     trade
severity   error
engine     doris
sql        checks/enum_payment_status.sql
op         eq
expect     0
description 支付成功率的分母只认这两个取值，多一个就会把比率算歪

[check.funnel_monotonic]
title      漏斗逐级收窄（VIEW>CLICK>CART>BUY）
domain     traffic
severity   error
engine     doris
sql        checks/funnel_monotonic.sql
op         ge
expect     1
description AGENTS.md 8.2 的数据正确性断言；SQL 返回 1 表示四级确实逐级收窄，否则 0
hint       不单调 → 先确认 DWD 去重是否生效（重复 VIEW 会把第一级抬高）


# ============================================================
# 五、层间一致性
#
# 三种"层间"：
#   1) 实时 DWD ↔ MySQL 事实源   （本次用 MySQL 侧计数做源）
#   2) 交易域 ↔ 流量域的同层口径 （离线 ADS 1d 与 1m 汇总必须相等）
#   3) DWD == ODS 逐表          （需要读湖仓 Iceberg，engine=spark，可选）
# ============================================================

[check.dwd_ads_order_parity]
title      层间一致：实时 DWD 订单数 == 离线 ADS 订单数
domain     cross
severity   error
engine     doris
sql        checks/mysql_dwd_order_parity.sql
op         eq
expect     0
description 唯一事实源落到实时 DWD 的行数，必须等于离线批次 ADS 的订单数合计
hint       非 0 → 实时链路丢事件，或离线批次的窗口边界少算了一天

[check.dwd_ads_behavior_parity]
title      层间一致：DWD 行为明细 == ADS 窗口 PV 合计（20000）
domain     layer
severity   error
engine     doris
sql        checks/ods_dwd_behavior_parity.sql
op         eq
expect     0
description PV 是可加指标：1m 与 1d 两种粒度的 PV 合计都必须等于明细行数
hint       非 0 → 行为白名单剔掉了非预期类型，或 ADS 窗口聚合丢行

[check.dwd_ads_trade_parity]
title      层间一致：DWD 订单数 == 离线 ADS 订单数合计
domain     layer
severity   error
engine     doris
sql        checks/ods_dwd_trade_parity.sql
op         eq
expect     0
description 订单数在明细层与窗口聚合层必须是同一个数（可加指标不应丢行）
hint       非 0 → 看 build_ads.py 的窗口边界，或装载脚本漏了分区

[check.ads_window_positive]
title      ADS 窗口数 > 0（四个窗口粒度表）
domain     layer
severity   error
engine     doris
sql        checks/ads_window_positive.sql
op         eq
expect     1
description 窗口聚合层的"非空守卫"：四个表的窗口数都必须 > 0

[check.ads_1m_1d_consistency]
title      离线 ADS 1m 汇总 == 1d 汇总（交易 2 项 + 流量 2 项）
domain     layer
severity   error
engine     doris
sql        checks/ads_1m_1d_consistency.sql
op         eq
expect     0
description 两个粒度必须能对得上，否则"报表和明细不一致"而没人发现

[check.dwd_ods_parity_all]
title      层间一致：DWD == ODS 逐表（湖仓 Iceberg，5 张交易表）
domain     layer
severity   error
engine     spark
table      iceberg.lakehouse_iceberg.dwd_orders
sql        checks/dwd_ods_parity_all.sql
op         gt
expect     -1
description 需要读 Iceberg（约 1 GB 内存），默认跳过，--with-lake 时才跑；返回不一致表数
hint       非 0 → 湖仓 DWD 层没有与 ODS 对齐，先重跑 batch-mode.sh --stage dwd


# ============================================================
# 六、金额关系
#
# 金额一律 DECIMAL(18,2)，**用等值比较**，不做浮点近似。
# 基准与实时链路一致：GMV = SUM(orders.amount) = 51,890,375.77（Sprint 1/3 的验收值）。
# 这里不设"容差"参数：容忍金额差就等于容忍错账，需要容差时应改口径而不是改断言。
# ============================================================

[check.amount_gmv_realtime]
title      金额关系：实时 DWD SUM(amount) == 离线 ADS SUM(gmv)
domain     trade
severity   error
engine     doris
sql        checks/amount_gmv_realtime.sql
op         eq
expect     0
description 实时链路与离线链路算出的 GMV 必须精确到分地相等（Sprint 3 的口径）
hint       非 0 → 批流不一致，先跑 batch-mode.sh --stage reconcile 看逐窗口差异

[check.amount_payment_le_order]
title      金额关系：支付金额 <= 订单金额（不允许超付）
domain     trade
severity   error
engine     doris
sql        checks/amount_payment_le_order.sql
op         ge
expect     1
description 业务上支付总额不可能超过下单总额；SQL 返回 1 表示关系成立
hint       返回 0 → 支付金额超过下单金额，先查 DWD 支付明细是否被重复累加

[check.amount_refund_le_payment]
title      金额关系：退款金额 <= 支付金额（不允许超退）
domain     trade
severity   error
engine     doris
sql        checks/amount_refund_le_payment.sql
op         ge
expect     1
description 与上一条同族的业务不变量
hint       返回 0 → 退款金额超过支付金额


# ============================================================
# 七、新鲜度（最新分区日期 / 最新窗口时间不超过阈值）
#
# !! 这台机器上的"新鲜度"必须用**滞后量**，不能用"数据必须是今天" !!
#   数据是 data-generator 一次性生成的（不是每天持续生产），
#   因此"最新分区 = 今天"永远是错的 —— 那会把一条正确的校验写成恒红。
#   正确的写法是：滞后 = 现在 - 最新数据时间 <= 阈值（小时）。
#
# 阈值取值（{FRESH_*} 由引擎注入，无需手工改）：
#   窗口类（1m ADS）默认 48h —— 为什么不是 26h：
#     !! 实测踩坑：一开始把阈值定成 26h（"每天跑一次批 + 2h 缓冲"），
#        结果本机**稳态就是 31.8h**：数据的事件时间最后到 T 日 13:16，
#        而按日调度的批处理在 T+1 日凌晨才把它算进 ADS，
#        T+1 的"现在"与 T 日 13:16 差 31.8h —— 这是**日批的正常形态**，
#        不是数据陈旧。阈值写 26h 会把一条正确的校验写成天天红，
#        而"天天红的校验"等于没有校验（人会自动忽略它）。
#     真正的语义边界是"漏跑了一整天的批"：
#       正常 26~32h  →  漏一天就变成 50~56h
#     因此取 48h：既能容忍日批的调度抖动，又能在漏跑一天时必然报警。
#   分区类（dt）默认 47.9h（= 48h - 6min）—— 因为 dt 取当天 00:00，
#     判据是"滞后 < 阈值"，减 6 分钟摊掉分钟级取整误差。
#   可用环境变量覆盖： FRESHNESS_WINDOW_HOURS / FRESHNESS_PARTITION_HOURS
#
# 为什么阈值必须"能过"而不是"越严越好"：
#   一条恒红的校验不会让人更谨慎，只会让人习惯性忽略红色。
#   真正有效的做法是让阈值卡在"正常不会红、真出问题一定红"的位置。
# ============================================================

[check.fresh_ads_traffic_1m]
title      新鲜度：ads_traffic_1m 最新窗口滞后 <= 48h
domain     traffic
severity   error
engine     doris
fresh_field window_start|最新分钟窗口时间
sql        checks/fresh_ads_traffic_1m.sql
op         lt
expect     {FRESH_WINDOW_HOURS}
description 流量域离线 ADS 的最新窗口不能落后现在超过阈值小时

[check.fresh_ads_trade_1m]
title      新鲜度：ads_batch_trade_1m 最新窗口滞后 <= 48h
domain     trade
severity   error
engine     doris
fresh_field window_start|最新分钟窗口时间
sql        checks/fresh_ads_trade_1m.sql
op         lt
expect     {FRESH_WINDOW_HOURS}
description 交易域离线 ADS 同上

[check.fresh_ads_traffic_1d]
title      新鲜度：ads_traffic_1d 最新分区日期滞后 <= 48h
domain     traffic
severity   error
engine     doris
fresh_field dt|最新天分区
sql        checks/fresh_ads_traffic_1d.sql
op         lt
expect     {FRESH_PARTITION_HOURS}
description 天粒度报表的"昨天/今天"边界；超过阈值说明天批没有按日推进

[check.fresh_dwd_behavior_dt]
title      新鲜度：DWD 行为明细最新 dt 滞后 <= 48h
domain     traffic
severity   error
engine     doris
fresh_field dt|DWD 最新 dt
sql        checks/fresh_ods_behavior.sql
op         lt
expect     {FRESH_PARTITION_HOURS}
description 贴源归档 → DWD 的最新 dt 与现在的差
