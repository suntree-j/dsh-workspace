[pytest]
# ============================================================
# pytest 配置
# ============================================================
#
# 运行：
#   python -m pytest                 # 全部测试
#   python -m pytest -m smoke        # 只跑冒烟测试（需要基础设施已启动）
#   python -m pytest -m "not smoke"  # 只跑不需要容器的单元测试
#
# 说明：
#   tests/smoke 下的用例需要 MySQL / Kafka / MinIO / Doris 已通过
#   `docker compose up -d` 启动，并已执行初始化脚本。
# ============================================================

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    smoke: 冒烟测试，需要基础设施（MySQL/Kafka/MinIO/Doris）已启动
    unit: 单元测试，不依赖任何外部服务
