# ============================================================
# Nginx 站点配置：数据平台前端 + 只读 API + 数据问答 Agent + 调度 UI
# ============================================================
#
# 对外访问（当前形态：明文 HTTP，单一站点）：
#   http://<服务器IP>/             → 302 跳转到 /data/
#   http://<服务器IP>/data/        → Vue 静态前端（services/web）
#   http://<服务器IP>/data/api/    → 反向代理到 uvicorn(127.0.0.1:8000)
#   http://<服务器IP>/data/agent/  → 反向代理到 uvicorn(127.0.0.1:8100)
#   http://<服务器IP>/airflow/     → 反向代理到 uvicorn(127.0.0.1:8085)
#
# !! 关于 TLS：已实现过，当前按项目负责人决定**暂不使用** !!
#
#   决定：暂时直接用 IP + 反向代理，不配证书；
#         后续注册域名、申请证书、完成备案之后再启用。
#   理由：按 IP 访问只能自签，浏览器每次会话都要点一次
#         "高级 → 继续前往"，演示时观感不好。
#
#   要把 HTTPS 加回来，做两件事即可（配置本身在 git 历史里，未丢失）：
#     1) bash scripts/setup-tls.sh        # 生成自签证书
#     2) 参考 commit 347dfdd 把 443 的 server 块加回本文件
#   拿到域名后则应改用受信任 CA 签发的证书（届时不再有警告）。
#
# ------------------------------------------------------------
# 当初为什么要上 HTTPS（排查结论，保留下来，因为它是真的）
# ------------------------------------------------------------
#
#   现象：客户端经公网访问约 40% 的请求返回 **502**，
#         且该 502 **没有 Server 响应头、响应体为空**。
#   判据：nginx 发出的 502 必然带 `Server: nginx/1.24.0` 与一段 HTML 错误页，
#         所以那个 502 **不是 nginx 发的**；
#         同时 TCP 80 十次全部连上、服务端本机自测十次全部 200、
#         nginx 访问/错误日志里没有任何 502、内核 ListenOverflows = 0。
#   结论：**明文 HTTP 在传输途中被中间设备改写**。
#
#   ★ 2026-09-26 补充实测（这是"现在可以不上 TLS"的依据）：
#     当时客户端本机开着 VPN 代理。**关闭 VPN 后重新测：
#     明文 HTTP 30/30 全部正常，零异常。**
#     说明那个改写响应的中间设备在 **VPN 的出口路径上**，
#     而不在这条 IP 直连的公网路径上。
#
#   ⚠️ 因此有一个前提要记住：**如果演示时又挂了 VPN / 代理，
#      那个偶发 502 可能回来**。届时要么关掉代理，要么按上面的
#      两步把 HTTPS 加回来（加密流量这类设备通常不碰）。
#
# 为什么把应用挂在 /data 子路径下：
#   1) 一台机器上还要放别的服务（Airflow UI 在 /airflow/，
#      将来 Sprint 11 的 Grafana 也会占一个子路径），
#      子路径能让它们共存而不用抢 80 端口的根路径；
#   2) 前端所有资源都用相对路径，挂在子路径下不需要改构建产物。
#
# 为什么应用只监听回环、由 Nginx 反代：
#   避免有人绕过反向代理直连 8000/8085/8100 端口，也避免把内部端口暴露到公网。
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    charset utf-8;
    client_max_body_size 2m;

    # 基础安全响应头（只读演示站点，不需要更复杂的策略）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # --------------------------------------------------------
    # 根路径：引导到 /data/
    # --------------------------------------------------------
    location = / {
        return 302 /data/;
    }

    # 不带斜杠的 /data 也要跳转，
    # 否则页面里的相对路径（./app.js）会解析到根目录而 404。
    location = /data {
        return 301 /data/;
    }

    # --------------------------------------------------------
    # 只读 API：/data/api/ → 127.0.0.1:8000/
    # proxy_pass 结尾带 / 会把 /data/api 前缀去掉，
    # 因此 FastAPI 侧看到的是 /health、/overview 等原始路径。
    # --------------------------------------------------------
    location /data/api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 只读接口：允许的请求方法收敛到 GET / HEAD / OPTIONS
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --------------------------------------------------------
    # 动态只读查询：POST /data/api/query（Sprint 7，Agent 专用）
    #
    # !! 为什么必须单独开一个 location !!
    #   上面 /data/api/ 里的 `limit_except GET HEAD OPTIONS { deny all; }`
    #   会把 POST 直接挡在 Nginx 层（返回 403），
    #   FastAPI 根本收不到请求 —— 表现为"Agent 一提问就 403"，
    #   而服务端日志里什么都没有，极难排查。
    #
    # !! 为什么这个接口用 POST 而不是 GET !!
    #   是**长度**问题而不是语义问题：LLM 生成的 SQL 常带多列与多个聚合，
    #   实测轻易超过 2KB，放查询串会撞上各级代理的 URL 长度限制，
    #   出现"简单问题能问、复杂问题失败"这种最难定位的故障。
    #   语义上它仍然是只读的：语句必须过 sqlguard（仅 SELECT、表白名单、
    #   强制 LIMIT），且使用只读账号 agent_ro。
    #
    # 用 `location = /data/api/query` 精确匹配，避免影响其它接口的方法约束。
    # 注意路径写法：这里是**带前缀的对外路径**（proxy_pass 再去掉前缀）。
    # --------------------------------------------------------
    location = /data/api/query {
        proxy_pass http://127.0.0.1:8000/query;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 只放行 POST（与 GET 的只读接口区分开，便于审计日志里一眼看出取数行为）
        limit_except POST {
            deny all;
        }

        proxy_connect_timeout 5s;
        # 动态查询可能较慢（Agent 会生成聚合 SQL），给到 30s；
        # 数据服务侧 Doris read_timeout 是 15s，这里必须比它大，
        # 否则会出现"数据服务查得好好的、Nginx 先超时"的假失败。
        proxy_read_timeout    30s;
    }

    # --------------------------------------------------------
    # 数据问答 Agent：/data/agent/ → 127.0.0.1:8100/（Sprint 7）
    #
    # Agent 是独立进程（systemd: data-platform-agent），
    # 与数据服务分开部署：它挂掉不影响看板与 API。
    # 这里放开 POST，因为提问内容放在请求体里（问题可能较长，
    # 且未来会带多轮上下文，不适合塞进 URL）。
    # --------------------------------------------------------
    location /data/agent/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # Agent 要串起"多次 LLM 调用 + 多次只读查询"，
        # 默认 60s 容易被正常的多轮分析超时；给到 180s。
        # 服务端自身有 AGENT_TOTAL_TIMEOUT（默认 120s）兜底，会先返回。
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }

    # --------------------------------------------------------
    # 前端：/data/ → services/web
    # --------------------------------------------------------
    location /data/ {
        alias /opt/data-platform/services/web/;
        index index.html;

        # 单页应用：找不到的路径回落到 index.html
        try_files $uri $uri/ /data/index.html;

        # 页面本身不缓存，避免更新后浏览器仍拿旧版本
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --------------------------------------------------------
    # Airflow UI：/airflow/ → 127.0.0.1:8085（Sprint 4 调度）
    #
    # !! 这里的 proxy_pass 结尾**绝对不能带 `/`**，与 /data/api/ 正好相反 !!
    #   两个应用的路径约定不同，实测过：
    #     /data/api/   →  proxy_pass http://127.0.0.1:8000/;
    #                     结尾带 / 会**剥掉** /data/api 前缀，
    #                     因为 FastAPI 侧注册的就是 /health、/overview。
    #     /airflow/    →  proxy_pass http://127.0.0.1:8085;
    #                     结尾不带 / 会**保留**前缀，
    #                     因为 Airflow 3 自己就提供带前缀的路径。
    #   实测证据（直连 8085 的结果）：
    #     /airflow/                  → 200（SPA 首页）
    #     /airflow/api/v2/monitor/health → 200
    #     /airflow/auth/token        → 201（登录接口）
    #     /airflow                   → 307（自动补斜杠）
    #   如果把这条也写成带 `/`，浏览器请求 /airflow/auth/token 会被转发成
    #   /auth/token → 405，表现是**登录页能打开、一登录就失败**，
    #   而直连 8085 却一切正常 —— 这种"直连好好的、走代理就坏"最难查。
    #
    # !! 为什么这个 UI 不额外加 Nginx basic auth !!
    #   任务书里原本写的是"加 basic auth"。实现时改成了只依赖 Airflow
    #   自身的登录（SimpleAuthManager，16 位随机口令）+ 只绑回环，
    #   理由：演示时多一层凭据就多一个出错点，而收益有限
    #   （Airflow 的 401 已经实测生效：未登录访问 /api/v2/dags 返回 401）。
    #   **这是对任务书的偏离，已如实记录在 SPRINT_4.md 的已知限制里**，
    #   并给出了升级路径。
    #
    #   ⚠️ 注意：这个 UI 能触发 DAG，而 DAG 任务能控制容器。
    #      在**没有 TLS** 的当前形态下，登录口令是明文传输的。
    #      演示环境可接受，但这是"等有了域名/证书要优先补上"的理由之一。
    # --------------------------------------------------------
    location /airflow/ {
        # 注意：结尾没有 /，保留前缀（理由见上方注释）
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Airflow UI 有实时刷新，走 WebSocket；不转发 Upgrade 头会退化成轮询
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        # 触发一次 DAG 后页面会等待状态刷新，给它宽裕些
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # 不带斜杠的 /airflow 交给 Airflow 自己 307（它返回的就是 307 到 /airflow/）
    location = /airflow {
        return 301 /airflow/;
    }

    # 第三方运行时（vue / echarts）：文件名含版本语义，可长缓存
    location /data/vendor/ {
        alias /opt/data-platform/services/web/vendor/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # 静态资源压缩（JSON 与前端脚本收益最大）
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # 健康探针：给运维/监控用，不暴露任何业务信息
    location = /data/healthz {
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    access_log /var/log/nginx/data-platform.access.log;
    error_log  /var/log/nginx/data-platform.error.log warn;
}
