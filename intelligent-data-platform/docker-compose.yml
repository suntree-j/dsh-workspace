# ============================================================
# 基于 Lakehouse 与 AI Agent 的批流一体智能数据分析平台
# Sprint 0 — 基础数据环境
# ============================================================
#
# 启动：
#   cp .env.example .env
#   docker compose up -d
#
# 镜像版本全部固定，不使用 latest。版本选型依据见
# docs/development-environment.md 第 3、4 节。
# ============================================================

name: data-platform

# ------------------------------------------------------------
# 统一网络
#
# 为什么需要固定子网与静态 IP？
#   Doris 的 init_fe.sh / entry_point.sh 使用正则严格校验
#   FE_SERVERS=<name>:<IPv4>:<port>，不接受主机名；同时会把
#   priority_networks 推导为 <IP 前三段>.0/24。
#   因此 Doris FE/BE 必须使用固定 IP，且网段必须与子网一致。
#   详见 docs/development-environment.md 第 4.5 / 4.6 节。
# ------------------------------------------------------------
networks:
  data-platform:
    name: data-platform
    driver: bridge
    ipam:
      config:
        - subnet: ${DATA_PLATFORM_SUBNET:-172.28.0.0/24}

# ------------------------------------------------------------
# 命名卷：容器重建后数据保留
# 注意：docker compose down -v 会删除全部数据
# ------------------------------------------------------------
volumes:
  mysql-data:
    name: data-platform-mysql-data
  kafka-data:
    name: data-platform-kafka-data
  minio-data:
    name: data-platform-minio-data
  doris-fe-meta:
    name: data-platform-doris-fe-meta
  doris-fe-log:
    name: data-platform-doris-fe-log
  doris-be-storage:
    name: data-platform-doris-be-storage
  doris-be-log:
    name: data-platform-doris-be-log

services:

  # ==========================================================
  # MySQL — 电商业务库
  #   容器内地址： mysql:3306
  # ==========================================================
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4.11}
    container_name: mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required - copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required - copy .env.example to .env}
    command:
      # 显式指定字符集，避免中文乱码
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 大数据量导入时放宽包大小限制
      - --max-allowed-packet=64M
      # Doris / 旧客户端兼容：允许 mysql_native_password 插件
      - --mysql-native-password=ON
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 业务表结构（独立存放且必须进 Git）
      - ./sql/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - data-platform
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ==========================================================
  # Kafka — 统一事件总线（KRaft 模式，无需 ZooKeeper）
  #   容器内地址： kafka:9092        （内部监听器）
  #   宿主机地址： localhost:19092   （外部监听器，见 README 说明）
  # ==========================================================
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.2.1}
    container_name: kafka
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # --- 节点角色：单节点同时充当 broker + controller（KRaft） ---
      KAFKA_NODE_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_BROKER_ID:-1}@kafka:9093
      # --- 监听器定义 ---
      #   INTERNAL //kafka:9092     容器之间互访（符合项目网络规范）
      #   CONTROLLER //kafka:9093   KRaft 控制器（仅集群内）
      #   EXTERNAL //localhost:19092 宿主机上的 Python / CLI 客户端
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- 单节点开发环境 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # --- 持久化 ---
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-19092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - data-platform
    healthcheck:
      # 用 Kafka 官方 CLI 检查 broker 是否真正可用（区分“已启动”与“已就绪”）
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  # ==========================================================
  # Kafka Topic 初始化（一次性容器）
  #   创建 order_event / payment_event / refund_event / behavior_event
  # ==========================================================
  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-4.2.1}
    container_name: kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
    entrypoint: ["/bin/bash", "/init/01-create-topics.sh"]
    volumes:
      - ./infrastructure/kafka/init:/init:ro
    networks:
      - data-platform

  # ==========================================================
  # MinIO — S3 兼容对象存储（湖仓存储底座）
  #   容器内地址： minio:9000
  # ==========================================================
  minio:
    image: ${MINIO_IMAGE:-coollabsio/minio}:${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    container_name: minio
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - copy .env.example to .env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
      # 健康检查脚本（镜像内无 curl，只能用 mc，详见脚本内注释）
      - ./infrastructure/minio/healthcheck.sh:/usr/local/bin/minio-healthcheck.sh:ro
    networks:
      - data-platform
    healthcheck:
      # 说明：minio 镜像基于 BusyBox，**不含 curl / wget / nc / sed / awk / grep**，
      #       只有 sh 内建、busybox 基础工具与 /usr/bin/mc。
      #       且 `mc ready <url>` 在未配置别名时打印错误却返回退出码 0，
      #       会把不健康的服务误判为健康。
      #       因此使用脚本显式构造别名后执行 `mc ls`。
      test: ["CMD", "/bin/sh", "/usr/local/bin/minio-healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ==========================================================
  # MinIO Bucket 初始化（一次性容器）
  #   创建 lakehouse bucket
  #   说明：MinIO 自 2025-10 起停止分发官方镜像，minio/mc 已下架，
  #        因此直接复用 minio 镜像内置的 /usr/bin/mc，不引入新镜像。
  # ==========================================================
  minio-init:
    image: ${MINIO_IMAGE:-coollabsio/minio}:${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    container_name: minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
    entrypoint: ["/bin/sh", "/init/01-create-bucket.sh"]
    volumes:
      - ./infrastructure/minio/init:/init:ro
    networks:
      - data-platform

  # ==========================================================
  # Apache Doris FE — 前端（查询入口 + 元数据）
  #   容器内地址： doris-fe:9030（MySQL 协议）/ doris-fe:8030（HTTP）
  #   固定 IP：   ${DORIS_FE_IP}（Doris 脚本要求必须是 IPv4）
  # ==========================================================
  doris-fe:
    image: apache/doris:fe-${DORIS_VERSION:-4.1.4}
    container_name: doris-fe
    hostname: doris-fe
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # ELECTION 模式：fe1 为主节点。必须是 IPv4:port，不能是主机名。
      FE_SERVERS: fe1:${DORIS_FE_IP:-172.28.0.10}:9010
      FE_ID: "1"
      # 限制 JVM 堆，避免单机环境占用过多内存
      JAVA_OPTS: ${DORIS_FE_JAVA_OPTS:--Xmx2048m -Xms1024m}
    ports:
      - "${DORIS_FE_HTTP_PORT:-8030}:8030"
      - "${DORIS_FE_QUERY_PORT:-9030}:9030"
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    # Doris 需要较高的文件描述符上限。
    # 容器默认 soft nofile 仅 1024，会导致启动或高并发查询失败。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      data-platform:
        ipv4_address: ${DORIS_FE_IP:-172.28.0.10}
    healthcheck:
      # 用 FE 自身的 HTTP 接口确认「服务就绪」，而非「容器已启动」
      test: ["CMD-SHELL", "curl -fsS http://localhost:8030/api/bootstrap >/dev/null 2>&1 || bash -c 'exec 3<>/dev/tcp/127.0.0.1/9030'"]
      interval: 15s
      timeout: 10s
      retries: 20
      # FE 首次启动需要初始化元数据，给足冷启动时间
      start_period: 90s

  # ==========================================================
  # Apache Doris BE — 后端（存储与计算）
  #   BE 启动时会自动向 FE 注册：ALTER SYSTEM ADD BACKEND
  # ==========================================================
  doris-be:
    image: apache/doris:be-${DORIS_VERSION:-4.1.4}
    container_name: doris-be
    hostname: doris-be
    restart: unless-stopped
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      FE_SERVERS: fe1:${DORIS_FE_IP:-172.28.0.10}:9010
      BE_ADDR: ${DORIS_BE_IP:-172.28.0.11}:9050
      # 单机环境必须限制 BE 内存，否则默认值会吃满宿主机内存
      # （BE 默认 mem_limit 为物理内存的 80%）
      BE_MEM_LIMIT: ${DORIS_BE_MEM_LIMIT:-4294967296}
    ports:
      - "${DORIS_BE_HTTP_PORT:-8040}:8040"
      # 9050 / 9060 为 BE 内部心跳与 brpc 端口，仅在集群内使用，不映射到宿主机
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
      # BE 的 entry_point.sh 会自动执行此目录下的 *.sql / *.sh
      - ./sql/doris:/docker-entrypoint-initdb.d:ro
    # Doris 需要较高的文件描述符上限（容器默认 soft nofile 仅 1024）
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      data-platform:
        ipv4_address: ${DORIS_BE_IP:-172.28.0.11}
    healthcheck:
      # BE 就绪后其 HTTP 端口 8040 会返回健康信息
      test: ["CMD-SHELL", "curl -fsS http://localhost:8040/api/health >/dev/null 2>&1 || bash -c 'exec 3<>/dev/tcp/127.0.0.1/8040'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ==========================================================
  # Python 数据生成器（按需运行，不随 up -d 自动启动）
  #
  #   生成 MySQL 业务数据：
  #     docker compose run --rm data-generator python -m src.generate_mysql_data
  #   生成 Kafka 实时事件：
  #     docker compose run --rm data-generator python -m src.generate_events
  #
  #   Sprint 0 不自动生成数据，避免 up -d 后无人值守地写入大量数据。
  # ==========================================================
  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    image: data-platform/data-generator:0.1.0
    container_name: data-generator
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 容器内必须使用服务名，禁止 localhost
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
    volumes:
      - ./data-generator:/app
    networks:
      - data-platform
