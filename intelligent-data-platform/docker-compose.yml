# ============================================================
# 基于 Lakehouse 与 AI Agent 的批流一体智能数据分析平台
# Sprint 0 — 基础数据环境
# Sprint 1 — Kafka + Flink + Doris 实时数仓
# Sprint 2 — Spark + Hive + 湖仓存储（离线链路）
# ============================================================
#
# 启动：
#   cp .env.example .env
#   docker compose up -d
#
# 镜像版本全部固定，不使用 latest。版本选型依据见
# docs/development-environment.md 第 3、4 节。
# ============================================================

name: data-platform

# ------------------------------------------------------------
# 统一网络
#
# 为什么需要固定子网与静态 IP？
#   Doris 的 init_fe.sh / entry_point.sh 使用正则严格校验
#   FE_SERVERS=<name>:<IPv4>:<port>，不接受主机名；同时会把
#   priority_networks 推导为 <IP 前三段>.0/24。
#   因此 Doris FE/BE 必须使用固定 IP，且网段必须与子网一致。
#   详见 docs/development-environment.md 第 4.5 / 4.6 节。
# ------------------------------------------------------------
networks:
  data-platform:
    name: data-platform
    driver: bridge
    ipam:
      config:
        - subnet: ${DATA_PLATFORM_SUBNET:-172.28.0.0/24}

# ------------------------------------------------------------
# 命名卷：容器重建后数据保留
# 注意：docker compose down -v 会删除全部数据
# ------------------------------------------------------------
volumes:
  mysql-data:
    name: data-platform-mysql-data
  kafka-data:
    name: data-platform-kafka-data
  minio-data:
    name: data-platform-minio-data
  doris-fe-meta:
    name: data-platform-doris-fe-meta
  doris-fe-log:
    name: data-platform-doris-fe-log
  doris-be-storage:
    name: data-platform-doris-be-storage
  doris-be-log:
    name: data-platform-doris-be-log
  data-generator-state:
    name: data-platform-data-generator-state
  flink-checkpoints:
    name: data-platform-flink-checkpoints
  # Spark Worker 的本地工作目录（shuffle / spill），用卷避免写满容器层
  spark-work:
    name: data-platform-spark-work

services:

  # ==========================================================
  # MySQL — 电商业务库
  #   容器内地址： mysql:3306
  # ==========================================================
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4.11}
    container_name: mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required - copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required - copy .env.example to .env}
    command:
      # 显式指定字符集，避免中文乱码
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 大数据量导入时放宽包大小限制
      - --max-allowed-packet=64M
      # Doris / 旧客户端兼容：允许 mysql_native_password 插件
      - --mysql-native-password=ON
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 业务表结构（独立存放且必须进 Git）
      - ./sql/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - data-platform
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ==========================================================
  # Kafka — 统一事件总线（KRaft 模式，无需 ZooKeeper）
  #   容器内地址： kafka:9092        （内部监听器）
  #   宿主机地址： localhost:19092   （外部监听器，见 README 说明）
  # ==========================================================
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.2.1}
    container_name: kafka
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # --- 节点角色：单节点同时充当 broker + controller（KRaft） ---
      KAFKA_NODE_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_BROKER_ID:-1}@kafka:9093
      # --- 监听器定义 ---
      #   INTERNAL //kafka:9092     容器之间互访（符合项目网络规范）
      #   CONTROLLER //kafka:9093   KRaft 控制器（仅集群内）
      #   EXTERNAL //localhost:19092 宿主机上的 Python / CLI 客户端
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- 单节点开发环境 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # --- JVM 堆 ---
      # 官方镜像默认 -Xmx1G。本项目只有 12 个 topic、每个 3 分区，
      # 512m 足够；Sprint 2 上线 Spark/Hive 后需要把省下的内存让给它们
      # （内存实测与降配依据见 docs/sprint/SPRINT_2.md 第 2.3 节）。
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms256m}
      # --- 持久化 ---
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-19092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - data-platform
    healthcheck:
      # 用 Kafka 官方 CLI 检查 broker 是否真正可用（区分“已启动”与“已就绪”）
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  # ==========================================================
  # Kafka Topic 初始化（一次性容器）
  #   创建 order_event / payment_event / refund_event / behavior_event
  # ==========================================================
  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-4.2.1}
    container_name: kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
    entrypoint: ["/bin/bash", "/init/01-create-topics.sh"]
    volumes:
      - ./infrastructure/kafka/init:/init:ro
    networks:
      - data-platform

  # ==========================================================
  # MinIO — S3 兼容对象存储（湖仓存储底座）
  #   容器内地址： minio:9000
  # ==========================================================
  minio:
    image: ${MINIO_IMAGE:-coollabsio/minio}:${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    container_name: minio
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - copy .env.example to .env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
      # 健康检查脚本（镜像内无 curl，只能用 mc，详见脚本内注释）
      - ./infrastructure/minio/healthcheck.sh:/usr/local/bin/minio-healthcheck.sh:ro
    networks:
      - data-platform
    healthcheck:
      # 说明：minio 镜像基于 BusyBox，**不含 curl / wget / nc / sed / awk / grep**，
      #       只有 sh 内建、busybox 基础工具与 /usr/bin/mc。
      #       且 `mc ready <url>` 在未配置别名时打印错误却返回退出码 0，
      #       会把不健康的服务误判为健康。
      #       因此使用脚本显式构造别名后执行 `mc ls`。
      test: ["CMD", "/bin/sh", "/usr/local/bin/minio-healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ==========================================================
  # MinIO Bucket 初始化（一次性容器）
  #   创建 lakehouse bucket
  #   说明：MinIO 自 2025-10 起停止分发官方镜像，minio/mc 已下架，
  #        因此直接复用 minio 镜像内置的 /usr/bin/mc，不引入新镜像。
  # ==========================================================
  minio-init:
    image: ${MINIO_IMAGE:-coollabsio/minio}:${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    container_name: minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
    entrypoint: ["/bin/sh", "/init/01-create-bucket.sh"]
    volumes:
      - ./infrastructure/minio/init:/init:ro
    networks:
      - data-platform

  # ==========================================================
  # Apache Doris FE — 前端（查询入口 + 元数据）
  #   容器内地址： doris-fe:9030（MySQL 协议）/ doris-fe:8030（HTTP）
  #   固定 IP：   ${DORIS_FE_IP}（Doris 脚本要求必须是 IPv4）
  # ==========================================================
  doris-fe:
    image: apache/doris:fe-${DORIS_VERSION:-4.1.4}
    container_name: doris-fe
    hostname: doris-fe
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # ELECTION 模式：fe1 为主节点。必须是 IPv4:port，不能是主机名。
      FE_SERVERS: fe1:${DORIS_FE_IP:-172.28.0.10}:9010
      FE_ID: "1"
      # 限制 JVM 堆，避免单机环境占用过多内存
      JAVA_OPTS: ${DORIS_FE_JAVA_OPTS:--Xmx2048m -Xms1024m}
    ports:
      - "${DORIS_FE_HTTP_PORT:-8030}:8030"
      - "${DORIS_FE_QUERY_PORT:-9030}:9030"
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    # Doris 需要较高的文件描述符上限。
    # 容器默认 soft nofile 仅 1024，会导致启动或高并发查询失败。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      data-platform:
        ipv4_address: ${DORIS_FE_IP:-172.28.0.10}
    healthcheck:
      # 用 FE 自身的 HTTP 接口确认「服务就绪」，而非「容器已启动」
      test: ["CMD-SHELL", "curl -fsS http://localhost:8030/api/bootstrap >/dev/null 2>&1 || bash -c 'exec 3<>/dev/tcp/127.0.0.1/9030'"]
      interval: 15s
      timeout: 10s
      retries: 20
      # FE 首次启动需要初始化元数据，给足冷启动时间
      start_period: 90s

  # ==========================================================
  # Apache Doris BE — 后端（存储与计算）
  #   BE 启动时会自动向 FE 注册：ALTER SYSTEM ADD BACKEND
  #
  # ⚠️ 已知上游问题与处理方式
  #   实测 apache/doris:be-4.1.4 的 entry_point.sh 在 check_be_status
  #   检测到 BE 就绪后即返回，main() 结束导致容器 PID 1 退出，
  #   Docker 随即终止 doris_be 并按 restart 策略重启，
  #   形成「每 ~15 秒重启一次」的循环（RestartCount 持续增长，
  #   但无 OOM、ExitCode=0）。
  #   因此这里用 infrastructure/doris/be-keepalive.sh 包装：
  #   先执行原始初始化完成注册，再在前台保活 BE。
  #   上游修复后可移除 command 覆盖，恢复镜像默认 entrypoint。
  #   详见 docs/development-environment.md「已知问题」。
  # ==========================================================
  doris-be:
    image: apache/doris:be-${DORIS_VERSION:-4.1.4}
    container_name: doris-be
    hostname: doris-be
    restart: unless-stopped
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      FE_SERVERS: fe1:${DORIS_FE_IP:-172.28.0.10}:9010
      BE_ADDR: ${DORIS_BE_IP:-172.28.0.11}:9050
      # 单机环境必须限制 BE 内存，否则默认值会吃满宿主机内存
      # （BE 默认 mem_limit 为物理内存的 80%）
      BE_MEM_LIMIT: ${DORIS_BE_MEM_LIMIT:-4294967296}
    # 覆盖镜像默认 entrypoint，改用保活包装（原因见上方说明）
    entrypoint: ["/bin/bash", "/opt/doris-be-keepalive.sh"]
    ports:
      - "${DORIS_BE_HTTP_PORT:-8040}:8040"
      # 9050 / 9060 为 BE 内部心跳与 brpc 端口，仅在集群内使用，不映射到宿主机
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
      # BE 的 entry_point.sh 会自动执行此目录下的 *.sql / *.sh
      - ./sql/doris:/docker-entrypoint-initdb.d:ro
      # Doris BE 保活包装（规避上游 entry_point.sh 提前退出问题）
      - ./infrastructure/doris/be-keepalive.sh:/opt/doris-be-keepalive.sh:ro
    # Doris 需要较高的文件描述符上限（容器默认 soft nofile 仅 1024）
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      data-platform:
        ipv4_address: ${DORIS_BE_IP:-172.28.0.11}
    healthcheck:
      # BE 就绪后其 HTTP 端口 8040 会返回健康信息
      test: ["CMD-SHELL", "curl -fsS http://localhost:8040/api/health >/dev/null 2>&1 || bash -c 'exec 3<>/dev/tcp/127.0.0.1/8040'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ==========================================================
  # Python 数据生成器（按需运行，不随 up -d 自动启动）
  #
  #   生成 MySQL 业务数据：
  #     docker compose run --rm data-generator python -m src.generate_mysql_data
  #   生成 Kafka 实时事件：
  #     docker compose run --rm data-generator python -m src.generate_events
  #
  #   Sprint 0 不自动生成数据，避免 up -d 后无人值守地写入大量数据。
  # ==========================================================
  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    image: data-platform/data-generator:0.1.0
    container_name: data-generator
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 容器内必须使用服务名，禁止 localhost
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
    volumes:
      # 源码挂载：便于本地改动立即生效，无需重建镜像
      - ./data-generator:/app
      # 快照目录单独用命名卷
      # 原因：容器以非 root 的 appuser 运行，而 ./data-generator 由宿主机
      #       以 root/其他属主挂载，导致 /app/state 不可写
      #       （实测 PermissionError: '/app/state/dataset_snapshot.json'）。
      #       命名卷由 Docker 初始化时会继承镜像内 /app/state 的权限。
      - data-generator-state:/app/state
    networks:
      - data-platform

  # ==========================================================
  # ============== Sprint 1：实时数仓（Flink） ================
  # ==========================================================
  #
  # 架构：
  #   Kafka 事件 → Flink 清洗/补维/窗口聚合 → Kafka 指标 topic
  #              → Doris Routine Load → DWD/DWS/ADS 表
  #
  # 为什么不让 Flink 直写 Doris：
  #   见 docs/sprint/SPRINT_1.md 第 2.1 节 —— 避免依赖
  #   doris-flink-connector（Doris/Flink/connector 三方版本绑定），
  #   改用 Doris 内置 Routine Load：零额外依赖、自带断点续传。
  #
  # 为什么用 Session 集群 + SQL Gateway 而不是 run-application：
  #   Gateway 提供 REST 接口，可对每条 SQL 单独判错与重试；
  #   Session 下所有作业共享集群，无需为每个作业打包 JAR。
  # ==========================================================

  # ----------------------------------------------------------
  # Flink JobManager（集群主节点，提供 REST API 8081）
  # ----------------------------------------------------------
  flink-jobmanager:
    build:
      context: ./infrastructure/flink
      dockerfile: Dockerfile
    image: data-platform/flink:1.20.1
    container_name: flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 官方镜像约定：JOB_MANAGER_RPC_ADDRESS 决定 jobmanager.rpc.address
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      # 冒号分隔的 key:value 列表，由镜像 entrypoint 写入 config.yaml
      FLINK_PROPERTIES: |
        jobmanager.memory.process.size: ${FLINK_JOBMANAGER_MEMORY:-1024m}
        rest.address: 0.0.0.0
        rest.port: 8081
        parallelism.default: 3
        execution.checkpointing.interval: 60s
        execution.checkpointing.mode: EXACTLY_ONCE
    ports:
      - "${FLINK_REST_PORT:-8081}:8081"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks:
      - data-platform
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  # ----------------------------------------------------------
  # Flink TaskManager（工作节点，2 slots）
  # ----------------------------------------------------------
  flink-taskmanager:
    build:
      context: ./infrastructure/flink
      dockerfile: Dockerfile
    image: data-platform/flink:1.20.1
    container_name: flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: ${FLINK_TASKMANAGER_MEMORY:-3072m}
        taskmanager.numberOfTaskSlots: ${FLINK_TASKMANAGER_SLOTS:-8}
        # 说明：Sprint 1 共有 8 个常驻作业（4 个 DWD + 4 个指标），
        # 每个作业至少占 1 个 slot，因此默认给 8 个 slot。
        # slot 不足时新作业会报
        #   NoResourceAvailableException: Could not acquire the minimum required resources
        parallelism.default: 3
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks:
      - data-platform

  # ----------------------------------------------------------
  # Flink SQL Gateway（REST :8083，供作业提交容器调用）
  #
  # 官方镜像的 entrypoint 未内置 sql-gateway 子命令，
  # 因此覆盖 entrypoint 直接调用 bin/sql-gateway.sh。
  # ----------------------------------------------------------
  flink-sql-gateway:
    build:
      context: ./infrastructure/flink
      dockerfile: Dockerfile
    image: data-platform/flink:1.20.1
    container_name: flink-sql-gateway
    restart: unless-stopped
    user: flink
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "[sql-gateway] 等待 JobManager (flink-jobmanager:8081) 就绪 ..."
        for i in $$(seq 1 60); do
          if curl -fsS http://flink-jobmanager:8081/overview >/dev/null 2>&1; then
            echo "[sql-gateway] JobManager 已就绪"; break
          fi
          sleep 3
        done
        echo "[sql-gateway] 启动 SQL Gateway（前台）..."
        exec /opt/flink/bin/sql-gateway.sh start-foreground \
          -D rest.address=flink-jobmanager \
          -D rest.port=8081 \
          -D sql-gateway.endpoint.rest.address=0.0.0.0 \
          -D sql-gateway.endpoint.rest.port=8083 \
          -D sql-gateway.session.idle-timeout=1h
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${FLINK_SQL_GATEWAY_PORT:-8083}:8083"
    networks:
      - data-platform
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/v1/info >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ----------------------------------------------------------
  # Flink 作业提交（常驻容器）
  #
  # 提交完成后**保持 session 存活**：
  #   Flink 的作业生命周期绑定在 session 上，session 关闭则作业被取消，
  #   因此该容器必须常驻（这也是它不写成 init 语义的原因）。
  #
  # 为什么用 python:alpine 而不是 alpine：
  #   提交脚本需要处理 JSON 转义（SQL 中含引号与 $），
  #   且该镜像**不含 curl**（实测），用 python3 标准库 urllib 实现，
  #   可避免依赖外部命令。见 infrastructure/flink/init/01-submit-jobs.py
  # ----------------------------------------------------------
  flink-jobs:
    image: python:${PYTHON_VERSION:-3.12}-alpine
    container_name: flink-jobs
    restart: unless-stopped
    depends_on:
      flink-sql-gateway:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      FLINK_GATEWAY_URL: http://flink-sql-gateway:8083
      SQL_DIR: /opt/flink/sql
      KEEPALIVE_INTERVAL: "300"
    volumes:
      - ./infrastructure/flink/sql:/opt/flink/sql:ro
      - ./infrastructure/flink/init:/opt/flink/init:ro
    entrypoint: ["python3", "/opt/flink/init/01-submit-jobs.py"]
    networks:
      - data-platform

  # ==========================================================
  # Sprint 2 — 离线链路（Spark + Hive + 湖仓存储）
  # ==========================================================
  #
  # 数据流：
  #   MySQL（唯一事实源）──Spark JDBC──► Parquet on S3A(MinIO)
  #                                        └── Hive Metastore 目录 ──► ods_* 外部表
  #
  # 存储为什么用 S3A(MinIO) 而不是 HDFS：
  #   宿主机实测可用内存只剩约 2 GB（实时链路 + 看板 + Doris 已占用大部分），
  #   再加 HDFS（NN+DN 约 1.3 GB）会触发 OOM，进而拖垮已验收的实时链路。
  #   完整依据与"如何补回 HDFS"见 docs/sprint/SPRINT_2.md 第 2.2 节。
  #
  # 内存约束：下面每个服务都显式限制内存，避免拖垮宿主机。
  # ----------------------------------------------------------

  # ----------------------------------------------------------
  # Hive Metastore（只跑 Metastore，不跑 HiveServer2 / Tez）
  #
  # 版本选择（实测踩坑）：用 **3.1.3** 而不是 4.0.1。
  #   Spark 3.5 内置的 Hive 客户端是 2.3.9，而 Hive 4 的 Metastore 去掉了
  #   thrift 方法 get_table，Spark 建表时会报
  #     Unable to fetch table ... Invalid method name: 'get_table'
  #   Hive 3.1.x 同时支持新旧方法，是 Spark 3.x 生态验证过的搭配。
  #
  # 为什么不需要 HiveServer2：
  #   Spark 直接通过 thrift 访问 Metastore 目录即可建表/查表，
  #   HiveServer2 只是给 JDBC 客户端用的 SQL 网关，多一个数 GB 的进程。
  #
  # 元数据存 MySQL（库名 hive_metastore，由 scripts/init-lakehouse.sh
  # 用官方 schematool 初始化）；hive-site.xml 用 Hadoop 的 ${env.VAR}
  # 语法从环境变量取口令，仓库里不出现任何真实凭据。
  # ----------------------------------------------------------
  hive-metastore:
    # 默认值必须跟着 HIVE_VERSION 走 3.1.3：写成 4.0.1 时，
    # 只要 .env 里漏配 HIVE_VERSION 就会拉到不兼容的 Metastore（见上方说明）。
    image: apache/hive:${HIVE_VERSION:-3.1.3}
    container_name: hive-metastore
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      HIVE_METASTORE_USER: ${HIVE_METASTORE_USER:-hive}
      HIVE_METASTORE_PASSWORD: ${HIVE_METASTORE_PASSWORD:?HIVE_METASTORE_PASSWORD is required - copy .env.example to .env}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # IS_RESUME=true 让 entrypoint **跳过** schematool 初始化。
      #   为什么必须加：Hive 3.1.x 的 entrypoint 每次启动都跑 -initSchema，
      #   而元数据表已经存在时会报
      #     Error: Table 'CTLGS' already exists ... Schema initialization FAILED!
      #   容器因此崩溃重启（实测 RestartCount 一路涨到 18）。
      #   表结构改由 scripts/init-lakehouse.sh 在启动前用一次性容器初始化一次。
      IS_RESUME: "true"
      # Hive 自身 JVM 内存上限（默认会按宿主机内存自动放大，必须压住）
      HIVE_METASTORE_HEAPSIZE: ${HIVE_METASTORE_HEAPSIZE:-512}
      SERVICE_OPTS: "-Xmx${HIVE_METASTORE_HEAPSIZE:-512}m -XX:MaxMetaspaceSize=256m"
    volumes:
      - ./infrastructure/hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      # MySQL 驱动复用 Spark 侧下载的同一个 JAR，避免重复下载与版本漂移
      - ./infrastructure/spark/lib/mysql-connector-j-8.4.0.jar:/opt/hive/lib/mysql-connector-j-8.4.0.jar:ro
      # S3A（hadoop-aws + aws-sdk）也必须给 Metastore：服务端在解析
      # s3a:// 的库/表位置时要加载 S3AFileSystem。镜像的 tools/lib 下虽然有
      # hadoop-aws，但不在 Hive 的 classpath 上，实测报
      #   ClassNotFoundException: Class org.apache.hadoop.fs.s3a.S3AFileSystem not found
      # 版本必须与该镜像自带的 Hadoop 对齐（3.1.3 镜像 = Hadoop 3.1.0），
      # 所以用 hadoop-aws 3.1.0，而不是 Spark 侧的 3.3.4（会 NoSuchMethodError）。
      # 这两个 JAR 由 scripts/init-lakehouse.sh 从镜像里提取到 client-lib/。
      - ./infrastructure/hive/client-lib/hadoop-aws-3.1.0.jar:/opt/hive/lib/hadoop-aws-3.1.0.jar:ro
      - ./infrastructure/hive/client-lib/aws-java-sdk-bundle-1.11.271.jar:/opt/hive/lib/aws-java-sdk-bundle-1.11.271.jar:ro
    ports:
      - "${HIVE_METASTORE_PORT:-9083}:9083"
    mem_limit: 1280m
    networks:
      - data-platform
    healthcheck:
      # Metastore 没有 HTTP 接口，用端口探测
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9083' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ----------------------------------------------------------
  # Spark Master
  #   Web UI： http://<宿主>:8080
  #   RPC  ： spark://spark-master:7077
  # ----------------------------------------------------------
  spark-master:
    build:
      context: ./infrastructure/spark
    image: data-platform/spark:${SPARK_VERSION:-3.5.7}
    container_name: spark-master
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: ${SPARK_MASTER_MEMORY:-512m}
      SPARK_LOCAL_IP: spark-master
    volumes:
      - ./infrastructure/spark/jobs:/opt/jobs:ro
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_WEBUI_PORT:-8080}:8080"
    mem_limit: 1024m
    networks:
      - data-platform
    healthcheck:
      # Spark 的 MasterUI 绑定在容器主机名对应的地址上（不是 127.0.0.1），
      # 因此探测必须用服务名：实测 `curl http://localhost:8080/` 会 Connection refused，
      # 会让健康检查永远不过、进而卡住依赖它的 spark-worker。
      test: ["CMD-SHELL", "curl -fsS http://spark-master:8080/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # ----------------------------------------------------------
  # Spark Worker
  #   执行器跑在这里；`-m` 是该 Worker 能提供给执行器的总内存
  # ----------------------------------------------------------
  spark-worker:
    build:
      context: ./infrastructure/spark
    image: data-platform/spark:${SPARK_VERSION:-3.5.7}
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: ${SPARK_WORKER_DAEMON_MEMORY:-384m}
      SPARK_LOCAL_IP: spark-worker
    volumes:
      - ./infrastructure/spark/jobs:/opt/jobs:ro
      - spark-work:/opt/spark/work
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
      - --cores
      - "${SPARK_WORKER_CORES:-2}"
      - --memory
      - "${SPARK_WORKER_MEMORY:-1536m}"
    ports:
      - "${SPARK_WORKER_WEBUI_PORT:-8091}:8081"
    mem_limit: 2048m
    networks:
      - data-platform
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://spark-worker:8081/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # ----------------------------------------------------------
  # Spark 作业提交容器（**按需运行**，不常驻）
  #
  # 为什么不做成常驻容器：
  #   Spark 作业是一次性的批处理，跑完就退出；常驻只会白占内存
  #   （driver 1 GB）。用 `docker compose run --rm spark-submit ...`
  #   调用，由 scripts/submit-offline-job.sh 封装。
  #
  # profile=tools：`docker compose up -d` 不会启动它，
  # 只有显式 run 时才创建，符合"按需"语义。
  # ----------------------------------------------------------
  spark-submit:
    build:
      context: ./infrastructure/spark
    image: data-platform/spark:${SPARK_VERSION:-3.5.7}
    container_name: spark-submit
    profiles: ["tools"]
    depends_on:
      spark-master:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 注意：这里**不要**设置 SPARK_LOCAL_IP=spark-submit。
      # 该服务是用 `docker compose run --rm` 临时启动的，容器名由 compose 生成，
      # 网络里并不存在 spark-submit 这个 DNS 记录，写了会直接报
      #   UnknownHostException: spark-submit: Temporary failure in name resolution
      # 不设置时 Spark 自动使用容器 IP，执行器可以正常连回 driver。
    volumes:
      - ./infrastructure/spark/jobs:/opt/jobs:ro
      - ./sql/hive:/opt/sql/hive:ro
      # 分层作业自带的 SQL（ODS→DWD→DWS→ADS→对账）。
      #
      # !! 不能挂在 /opt/jobs/sql（实测踩坑）!!
      #   /opt/jobs 已经是只读挂载，Docker 在其下再创建挂载点时
      #   会因为父目录只读而失败：
      #     mkdirat .../opt/jobs/sql: read-only file system
      #   所以挂到 /opt/jobs 之外的平级目录，作业侧通过
      #   spark.jobs.layerSqlDir 显式指定（见 scripts/lib/spark-job.sh）。
      - ./infrastructure/spark/sql:/opt/layer-sql:ro
    networks:
      - data-platform
